name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxSync-Pro-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  # 로컬 빌드를 위해 gradle-wrapper.jar 파일을 만들어주는 작업입니다.
  # 실행 후 Artifacts에서 wrapper.zip을 다운로드해 프로젝트 루트에 압축 해제하세요.
  make-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Package wrapper files
        run: |
          mkdir -p wrapper-output/gradle/wrapper
          cp gradlew gradlew.bat wrapper-output/
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties wrapper-output/gradle/wrapper/

      - name: Upload wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: wrapper-output/
          retention-days: 7